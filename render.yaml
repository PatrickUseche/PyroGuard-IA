services:
  - type: web
    name: pyroguard-ia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Con APP_ENV=production el servicio no arranca sin AI_API_KEY (evita dejar /predict abierto).
      - key: APP_ENV
        value: production
      # Se rellena a mano en el panel de Render; debe ser igual a la AI_API_KEY del backend.
      - key: AI_API_KEY
        sync: false
